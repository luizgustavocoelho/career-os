services:
  api:
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      APP_ORIGIN: https://${DOMAIN:?Defina DOMAIN}
      ALLOWED_ORIGINS: https://${DOMAIN:?Defina DOMAIN}
  worker:
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      APP_ORIGIN: https://${DOMAIN:?Defina DOMAIN}
      ALLOWED_ORIGINS: https://${DOMAIN:?Defina DOMAIN}
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Defina ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
